<title>Ore Refining Chart</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root {
  --bg: #05080c;
  --panel: #0a1017;
  --ink: #c9d6e3;
  --muted: #6f8295;
  --line: #1f2d3b;
  --edge: #3b4b5c;
  --accent: #e8b04a;
  --no: #e0604f;
  --f-stony: #d1b88f;
  --f-metallic: #9ec7ff;
  --f-carbonaceous: #ff8c47;
  --f-ice: #73f2ff;
  --f-crystal: #e08cff;
  --f-gas: #8cff80;
  --font: "Segoe UI", Tahoma, Arial, sans-serif;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--ink); font: 13px/1.45 var(--font); }
.wrap { max-width: 1100px; margin: 0 auto; padding-block: 14px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 8px; }
.bar-row { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; justify-content: space-between; }
.toggle { display: inline-flex; border: 1px solid var(--line); }
.toggle button { font: 11px var(--font); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); background: transparent; border: 0; padding: 5px 10px; cursor: pointer; }
.toggle button + button { border-left: 1px solid var(--line); }
.toggle button[aria-pressed="true"] { background: var(--accent); color: #05080c; }
.toggle button:focus-visible, .node:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--muted); font-size: 11px; align-items: center; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.frame { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); }
#tree { display: block; min-width: 960px; width: 100%; height: auto; }
#tree text { font-family: var(--font); fill: var(--ink); font-size: 12px; }
#tree .colhead { text-transform: uppercase; letter-spacing: .1em; font-size: 10px; fill: var(--muted); }
#tree .subhead { font-size: 10px; fill: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.node { cursor: pointer; }
.node rect { fill: var(--bg); stroke: var(--line); stroke-width: 1; }
.node.sel rect { stroke: var(--accent); }
.node.off rect { stroke-dasharray: 2 2; }
.node.off { opacity: .3; }
.node.fade { opacity: .12; }
.node .tag { font-size: 9px; fill: var(--no); text-transform: uppercase; letter-spacing: .06em; }
.edge { fill: none; }
.edge.off { opacity: 0; }
.edge.fade { opacity: .05; }
.detail { border-top: 1px solid var(--line); padding-top: 8px; min-height: 64px; display: flex; flex-direction: column; gap: 2px; }
.detail h3 { margin: 0; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; display: flex; gap: 6px; align-items: center; }
.detail p { margin: 0; color: var(--muted); }
.detail b { color: var(--ink); font-weight: 600; }
.dot { width: 8px; height: 8px; flex: none; display: inline-block; }
.no { color: var(--no); }
</style>

<div class="wrap">
  <div class="bar-row">
    <div class="toggle" role="group" aria-label="Refinery">
      <button type="button" id="mode-station" aria-pressed="true">Resource Refinery</button>
      <button type="button" id="mode-carrier" aria-pressed="false">Carrier only</button>
    </div>
    <div class="legend">
      <span><svg width="24" height="6"><line x1="0" y1="3" x2="24" y2="3" stroke="#6f8295" stroke-width="2"/></svg>carrier gets it too</span>
      <span><svg width="24" height="6"><line x1="0" y1="3" x2="24" y2="3" stroke="#6f8295" stroke-width="2" stroke-dasharray="4 3"/></svg>Resource Refinery only</span>
      <span>thickness = yield per 10 ore</span>
    </div>
  </div>
  <div class="frame"><svg id="tree" viewBox="0 0 980 700" role="img" aria-label="Hierarchy from resource fields to refined goods, components and ships"></svg></div>
  <div class="detail" id="detail" aria-live="polite"></div>
</div>

<script>
const FIELDS = [
  ["stony", "Stony", "Common rock fields; Hiigara's home fields"],
  ["metallic", "Metallic", "Metal-rich fields, wreck and debris fields"],
  ["carbonaceous", "Carbonaceous", "Dark rock: Kaarsuun, Koban, Thaiirak"],
  ["ice", "Volatile ice", "Ice fields and rings; Selim"],
  ["gas", "Nebular gas", "Dust and gas clouds: Hiigara, Emerald Sea, Majoris"],
  ["crystal", "Crystal", "Kaarsuun ring, Beryl Roots, Koban disc"],
];
const GOODS = [
  ["alloy", "Basic alloy"], ["silicates", "Silicates"], ["hydrocarbons", "Hydrocarbons"], ["water", "Water"],
  ["oxygen", "Oxygen"], ["helium3", "Helium-3"], ["deuterium", "Deuterium"], ["actinides", "Actinides"],
  ["platinum", "Platinum"], ["gyorite", "Gyorite"], ["chemicals", "Industrial chemicals"],
];
const MARKET = [["trace", "Trace minerals"], ["terraforming", "Terraforming gases"], ["diamonds", "Diamonds"], ["silver", "Silver"], ["gold", "Gold"]];
// [Resource Refinery, carrier] per 10 ore
const Y = {
  stony: { alloy: [0.6, 0.4], silicates: [0.35, 0.2], oxygen: [0.15, 0], trace: [0.08, 0], actinides: [0.02, 0] },
  metallic: { alloy: [1, 0.7], silver: [0.08, 0], gold: [0.04, 0], platinum: [0.02, 0] },
  carbonaceous: { hydrocarbons: [0.45, 0.3], chemicals: [0.2, 0], water: [0.2, 0.1], alloy: [0.15, 0.1], oxygen: [0.1, 0], silicates: [0.1, 0], diamonds: [0.01, 0], actinides: [0.01, 0] },
  ice: { water: [0.5, 0.35], oxygen: [0.35, 0.25], deuterium: [0.2, 0], chemicals: [0.1, 0], terraforming: [0.05, 0] },
  gas: { helium3: [0.5, 0.35], deuterium: [0.3, 0], chemicals: [0.2, 0], terraforming: [0.2, 0] },
  crystal: { silicates: [0.7, 0.4], gyorite: [0.15, 0], diamonds: [0.05, 0] },
};
const COMPS = [
  ["c_fchassis", "Fighter Chassis", { alloy: 4 }],
  ["c_fdrive", "Fighter Drive", { alloy: 1, silicates: 2 }],
  ["c_cchassis", "Corvette Chassis", { alloy: 8, hydrocarbons: 2, water: 2, oxygen: 2 }],
  ["c_cdrive", "Corvette Drive", { alloy: 3, silicates: 3, helium3: 2 }],
  ["c_frchassis", "Frigate Chassis", { alloy: 20, hydrocarbons: 5, water: 5, oxygen: 5 }],
  ["c_frdrive", "Frigate Drive", { alloy: 8, silicates: 6, deuterium: 3, actinides: 1 }],
  ["c_dchassis", "Destroyer Chassis", { alloy: 50, hydrocarbons: 10, water: 12, oxygen: 12 }],
  ["c_ddrive", "Destroyer Drive", { alloy: 18, silicates: 12, deuterium: 8, actinides: 3 }],
  ["c_kchassis", "Capital Chassis", { alloy: 140, hydrocarbons: 30, water: 35, oxygen: 35 }],
  ["c_kdrive", "Capital Drive", { alloy: 45, silicates: 30, deuterium: 20, actinides: 8, platinum: 2 }],
  ["c_elec", "Electronics ×2", { silicates: 3, gyorite: 1 }],
  ["c_mun", "Munitions ×2", { alloy: 1, chemicals: 2 }],
  ["c_reac", "Reactor Components", { actinides: 2, alloy: 2, platinum: 1 }],
];
const SHIPS = [
  ["s_f", "Fighters", ["c_fchassis", "c_fdrive"]],
  ["s_c", "Corvettes", ["c_cchassis", "c_cdrive"]],
  ["s_fr", "Frigates", ["c_frchassis", "c_frdrive"]],
  ["s_d", "Destroyers", ["c_dchassis", "c_ddrive"]],
  ["s_k", "Capital ships", ["c_kchassis", "c_kdrive"]],
  ["s_elec", "Probes, sensors, cloak", ["c_elec"], "Probes, sensors, research ships, cloak and gravwell generators, drone frigates"],
  ["s_mun", "Bombers, minelayers", ["c_mun"], "Bombers, minelayers and missile destroyers"],
  ["s_reac", "Ion frigates, destroyers", ["c_reac"], "Ion cannon frigates and destroyers"],
];

const COLS = [{ x: 12, w: 168 }, { x: 272, w: 172 }, { x: 540, w: 186 }, { x: 806, w: 166 }];
const H = 28, TOP = 64;
const nodes = {}, edges = [];
const fmt = v => String(+v.toFixed(2));
const fc = id => `var(--f-${id})`;

FIELDS.forEach(([id, label, where], i) => nodes[id] = { id, label, where, col: 0, kind: "field", y: TOP + 30 + i * 94 });
GOODS.forEach(([id, label], i) => nodes[id] = { id, label, col: 1, kind: "good", y: TOP + i * 38 });
const marketTop = TOP + GOODS.length * 38 + 36;
MARKET.forEach(([id, label], i) => nodes[id] = { id, label, col: 1, kind: "good", market: true, y: marketTop + i * 38 });
COMPS.forEach(([id, label, inputs], i) => nodes[id] = { id, label, inputs, col: 2, kind: "comp", y: TOP + i * 44 + (i >= 10 ? 14 : 0) });
SHIPS.forEach(([id, label, from, long]) => {
  const y = from.reduce((s, c) => s + nodes[c].y, 0) / from.length;
  nodes[id] = { id, label, from, long, col: 3, kind: "ship", y };
});

for (const [f, goods] of Object.entries(Y))
  for (const [g, [s, c]] of Object.entries(goods)) edges.push({ a: f, b: g, s, c, kind: "fg" });
for (const [id, , inputs] of COMPS)
  for (const g of Object.keys(inputs)) edges.push({ a: g, b: id, kind: "gc" });
for (const [id, , from] of SHIPS)
  for (const c of from) edges.push({ a: c, b: id, kind: "cs" });
const inn = {}, out = {};
edges.forEach(e => { (out[e.a] ||= []).push(e); (inn[e.b] ||= []).push(e); });

// What a carrier alone can make
const carrierGoods = new Set(edges.filter(e => e.kind === "fg" && e.c > 0).map(e => e.b));
const missing = id => {
  const n = nodes[id];
  if (n.kind === "good") return carrierGoods.has(id) ? [] : [id];
  if (n.kind === "comp") return Object.keys(n.inputs).filter(g => !carrierGoods.has(g));
  if (n.kind === "ship") return [...new Set(n.from.flatMap(missing))];
  return [];
};
const carrierOk = id => missing(id).length === 0;

const svgNS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("tree");
const mk = (tag, attrs, parent) => { const e = document.createElementNS(svgNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };

["Fields", "Refined goods", "Components", "Ships"].forEach((t, i) => mk("text", { x: COLS[i].x, y: 30, class: "colhead" }, svg).textContent = t);
mk("text", { x: COLS[1].x, y: marketTop - 14, class: "subhead" }, svg).textContent = "Only sold at markets";
mk("text", { x: COLS[2].x, y: nodes.c_elec.y - 14, class: "subhead" }, svg).textContent = "Role goods";

const edgeLayer = mk("g", {}, svg);
for (const e of edges) {
  const A = nodes[e.a], B = nodes[e.b];
  const x1 = COLS[A.col].x + COLS[A.col].w, y1 = A.y + H / 2, x2 = COLS[B.col].x, y2 = B.y + H / 2, mx = (x1 + x2) / 2;
  const attrs = { d: `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`, class: "edge" };
  if (e.kind === "fg") {
    attrs.style = `stroke:${fc(e.a)}`;
    attrs["stroke-width"] = 1.2 + e.s * 5;
    if (!e.c) attrs["stroke-dasharray"] = "5 4";
  } else {
    attrs.style = "stroke:var(--edge)";
    attrs["stroke-width"] = 1.3;
  }
  e.el = mk("path", attrs, edgeLayer);
}

const nodeLayer = mk("g", {}, svg);
for (const n of Object.values(nodes)) {
  const c = COLS[n.col];
  const g = mk("g", { class: "node", tabindex: 0, role: "button", "aria-label": n.label }, nodeLayer);
  mk("rect", { x: c.x, y: n.y, width: c.w, height: H }, g);
  let tx = c.x + 10;
  if (n.kind === "field") { mk("circle", { cx: c.x + 14, cy: n.y + H / 2, r: 4, style: `fill:${fc(n.id)}` }, g); tx = c.x + 27; }
  const t = mk("text", { x: tx, y: n.y + H / 2 + 4.5 }, g);
  t.textContent = n.label;
  if (n.kind === "field") t.setAttribute("font-weight", "600");
  if (n.kind !== "field") {
    const tag = mk("text", { x: c.x + c.w - 8, y: n.y + H / 2 + 4, "text-anchor": "end", class: "tag" }, g);
    n.tag = tag;
  }
  n.el = g;
  g.addEventListener("click", () => select(state.sel === n.id ? null : n.id));
  g.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); select(state.sel === n.id ? null : n.id); } });
  g.addEventListener("mouseenter", () => { state.hover = n.id; apply(); });
  g.addEventListener("mouseleave", () => { state.hover = null; apply(); });
}
const maxY = Math.max(...Object.values(nodes).map(n => n.y)) + H + 16;
svg.setAttribute("viewBox", `0 0 980 ${maxY}`);

const state = { mode: "station", sel: null, hover: null };
const live = e => state.mode === "station" || (e.kind === "fg" ? e.c > 0 : carrierOk(e.a) && carrierOk(e.b));
const nodeLive = id => state.mode === "station" || carrierOk(id);

function trace(id) {
  const ns = new Set([id]), es = new Set();
  const walk = (start, dir) => {
    const stack = [start];
    while (stack.length) {
      const n = stack.pop();
      for (const e of (dir === "up" ? inn[n] : out[n]) || []) {
        if (!live(e)) continue;
        es.add(e);
        const next = dir === "up" ? e.a : e.b;
        if (!ns.has(next)) { ns.add(next); stack.push(next); }
      }
    }
  };
  walk(id, "up"); walk(id, "down");
  return { ns, es };
}

function apply() {
  const focus = state.hover ?? state.sel;
  const tr = focus ? trace(focus) : null;
  for (const n of Object.values(nodes)) {
    const ok = nodeLive(n.id);
    n.el.classList.toggle("off", !ok);
    n.el.classList.toggle("sel", n.id === state.sel);
    n.el.classList.toggle("fade", !!tr && !tr.ns.has(n.id));
    if (n.tag) n.tag.textContent = ok || n.market ? "" : "refinery";
  }
  for (const e of edges) {
    e.el.classList.toggle("off", !live(e));
    e.el.classList.toggle("fade", !!tr && !tr.es.has(e));
  }
  describe(focus);
}

const label = id => nodes[id].label;
const list = a => a.length < 2 ? a.join("") : a.slice(0, -1).join(", ") + " and " + a[a.length - 1];
function describe(id) {
  const d = document.getElementById("detail");
  const carrier = state.mode === "carrier";
  if (!id) {
    d.innerHTML = carrier
      ? `<h3>Carrier only</h3><p>Dashed boxes need a Resource Refinery or a market. A carrier can still make every chassis, fighter drives and corvette drives, but no bigger drives and no role goods.</p>`
      : `<h3>Select a box</h3><p>Shows where it comes from and what it leads to.</p>`;
    return;
  }
  const n = nodes[id];
  let h = "", p = [];
  if (n.kind === "field") {
    h = `<span class="dot" style="background:${fc(id)}"></span>${n.label}`;
    p.push(n.where + ".");
    p.push("Per 10 ore: " + list(Object.entries(Y[id]).map(([g, [s, c]]) => `<b>${label(g)} ${fmt(s)}</b>` + (c ? ` (carrier ${fmt(c)})` : ` (refinery only)`))) + ".");
  } else if (n.kind === "good") {
    h = n.label;
    p.push("From, per 10 ore: " + list((inn[id] || []).map(e => `<b>${label(e.a)} ${fmt(e.s)}</b>` + (e.c ? ` (carrier ${fmt(e.c)})` : ` (refinery only)`))) + ".");
    const used = (out[id] || []).map(e => label(e.b));
    p.push(used.length ? "Used in: " + list(used) + "." : "Not used by any component. Sell it at a market.");
  } else if (n.kind === "comp") {
    h = n.label;
    p.push("Inputs: " + list(Object.entries(n.inputs).map(([g, q]) => `<b>${q}</b> ${label(g).toLowerCase()}`)) + ".");
    const m = missing(id);
    p.push(m.length ? `<span class="no">Not with a carrier alone:</span> no ${list(m.map(g => label(g).toLowerCase()))}.` : "A carrier can make it, if it has that hull's production facility.");
  } else {
    h = n.label;
    if (n.long) p.push(n.long + " need this as a role good, on top of their hull's chassis and drive.");
    else p.push("Built from: " + list(n.from.map(label)) + ".");
    const m = missing(id);
    p.push(m.length ? `<span class="no">Not with a carrier alone:</span> no ${list(m.map(g => label(g).toLowerCase()))}.` : "A carrier can make all of the parts.");
  }
  d.innerHTML = `<h3>${h}</h3>` + p.map(x => `<p>${x}</p>`).join("");
}

function select(id) { state.sel = id; apply(); }
function setMode(m) {
  state.mode = m;
  document.getElementById("mode-station").setAttribute("aria-pressed", m === "station");
  document.getElementById("mode-carrier").setAttribute("aria-pressed", m === "carrier");
  apply();
}
document.getElementById("mode-station").addEventListener("click", () => setMode("station"));
document.getElementById("mode-carrier").addEventListener("click", () => setMode("carrier"));
apply();
</script>
